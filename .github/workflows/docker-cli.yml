# Builds the CLI image (docker/cli/Dockerfile) on pushes to master and on any tag, and publishes it to GHCR:
#   ghcr.io/abraxas-krown/gw2ei
# Tags: the branch name, sha-<short commit>, and `latest` for master.
# A git tag gives an image tag of the same name (v3.32.0.0 -> v3.32.0.0, v3.32.0.0-krown.1 -> v3.32.0.0-krown.1).
# Tag images are never replaced, since gw2raidar pins one (GW2EI_TAG); push a new git tag instead.
# Used by gw2raidar's Dockerfile as its Elite Insights stage.
name: Docker CLI image

on:
  push:
    branches: ["master"]
    tags: ["**"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]   # not applied to tag pushes
  workflow_dispatch:

# A newer push to the same branch cancels the build still running for the older one
concurrency:
  group: docker-cli-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/gw2ei
          # `latest` always means master, never the newest tag
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # For a tag build, meta's `version` is the image tag made from the git tag
      - name: Refuse to replace an existing tag
        if: github.ref_type == 'tag'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/gw2ei
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$TAG" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$TAG already exists; push a new git tag instead"
            exit 1
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/cli/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
